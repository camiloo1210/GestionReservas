<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reportes de Uso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar {
            min-height: 100vh;
            border-right: 1px solid #333;
        }

        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            display: block;
            padding: 10px 20px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #c70039;
            color: #fff;
        }

        .btn-primary {
            background-color: #c70039;
            border-color: #c70039;
        }

        .btn-primary:hover {
            background-color: #900c3f;
            border-color: #900c3f;
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <div class="sidebar p-3" style="width: 250px;">
            <h4 class="mb-4 text-center">Admin Panel</h4>
            <a href="dashboard.html">Inicio</a>
            <a href="rooms.html">Salas</a>
            <a href="reservations.html">Reservas</a>
            <a href="reports.html" class="active">Reportes</a>
            <a href="#" onclick="logout()" class="mt-5">Cerrar Sesión</a>
        </div>
        <div class="flex-grow-1 p-4">
            <h2>Reporte de Uso de Salas</h2>

            <div class="card mb-4">
                <div class="card-body">
                    <form id="reportForm" class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" class="form-control" id="startDate" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Fecha Fin</label>
                            <input type="date" class="form-control" id="endDate" required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Generar</button>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="button" class="btn btn-secondary w-100" onclick="exportPDF()">Exportar
                                PDF</button>
                        </div>
                    </form>
                </div>
            </div>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
            <script
                src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Detalle Numérico</h5>
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Sala</th>
                                        <th>Total Reservas</th>
                                    </tr>
                                </thead>
                                <tbody id="reportsBody">
                                    <!-- JS populates -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Gráfico de Ocupación</h5>
                            <canvas id="usageChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/reports.js"></script>
</body>

</html>
