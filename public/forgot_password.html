<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212;
        }

        .card {
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }

        .btn-primary {
            background-color: #c70039;
            border-color: #c70039;
        }

        .btn-primary:hover {
            background-color: #900c3f;
            border-color: #900c3f;
        }
    </style>
</head>

<body>
    <div class="card p-4">
        <h3 class="text-center mb-4">Recuperar Contraseña</h3>
        <form id="forgotForm">
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="tu@email.com">
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar Instrucciones</button>
            <div class="text-center mt-3">
                <a href="index.html" class="text-secondary text-decoration-none">Volver al Login</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                alert(data.message);

                if (res.ok) {
                    // Optionally clear form
                    document.getElementById('email').value = '';
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión');
            }
        });
    </script>
</body>

</html>
