<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>Estudiante Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Default dark theme handles bg/color */
        .navbar {
            border-bottom: 1px solid #333;
        }

        .navbar-brand {
            color: #c70039 !important;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #c70039;
            border-color: #c70039;
        }

        .btn-primary:hover {
            background-color: #900c3f;
            border-color: #900c3f;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 p-3">
        <div class="container">
            <a class="navbar-brand" href="#">UDLA Reservas</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="availability.html">Ver Disponibilidad</a></li>
                    <li class="nav-item"><a class="nav-link" href="my_reservations.html">Mis Reservas</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1>Bienvenido Estudiante</h1>
        <p>Utiliza el menú para consultar las salas disponibles.</p>
        <a href="availability.html" class="btn btn-primary mt-3">Ver Salas Disponibles</a>
    </div>

    <!-- Reminder Modal (HU13) -->
    <div class="modal fade" id="reminderModal" tabindex="-1" aria-labelledby="reminderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-warning">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title" id="reminderModalLabel">🔔 ¡Recordatorio de Reserva!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="reminderBody">
                    <!-- JS populates -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() {
            fetch('/api/auth/logout', { method: 'POST' })
                .then(() => window.location.href = '/index.html');
        }

        // Check for upcoming reservations on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/reservations/upcoming');
                if (!res.ok) return;

                const upcoming = await res.json();
                if (upcoming.length === 0) return;

                // Build reminder content
                let html = '<ul class="list-group">';
                upcoming.forEach(r => {
                    html += `
                        <li class="list-group-item bg-dark text-white border-secondary">
                            <strong>📍 ${r.room_name}</strong> (${r.location || 'Sin ubicación'})<br>
                            <small>📅 Hoy, ${r.start_time} - ${r.end_time}</small>
                        </li>
                    `;
                });
                html += '</ul>';
                html += '<p class="mt-3 text-muted small">Tienes reserva(s) que inician en menos de 1 hora.</p>';

                document.getElementById('reminderBody').innerHTML = html;

                // Show modal
                const modal = new bootstrap.Modal(document.getElementById('reminderModal'));
                modal.show();

            } catch (err) {
                console.error('Error checking reminders:', err);
            }
        });
    </script>
</body>

</html>
